name: CI

on:
  push:
    branches: [ main, master ]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      mongo:
        image: mongo:6
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --eval 'db.runCommand({ ping: 1 })'"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'

      - name: Install production dependencies (for audit)
        run: npm ci --omit=dev

      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high

      - name: Install all dependencies
        run: npm install

      - name: Run lint
        run: npm run lint --silent

      - name: Run tests
        env:
          MONGODB_URI: mongodb://localhost:27017/livepoetry
          NODE_ENV: test
        run: npm test -- --ci
